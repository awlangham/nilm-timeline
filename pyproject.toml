[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["start_dev.sh"]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel.force-include]
"frontend/build" = "nilmtimeline/static"

[project]
name = "nilmtimeline"
version = "0.0.1"
authors = [
  { name="Aaron Langham", email="alangham@mit.edu" },
]
description = "NILM timeline for load cycle tracking and diagnostics"
requires-python = ">=3.7"
dependencies = ["numpy", "fastapi", "uvicorn", "nilmevents"]

[project.scripts]
nilm-timeline = "nilmtimeline.main:run"