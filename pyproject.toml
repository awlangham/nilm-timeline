[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["start_dev.sh"]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel.force-include]
"frontend/build" = "nilmtimeline/static"

[project]
name = "nilmtimeline"
version = "0.4.1"
authors = [
  { name="Aaron Langham", email="alangham@mit.edu" },
]
description = "NILM timeline for load cycle tracking and diagnostics"
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib", "fastapi", "uvicorn", "click", "joule", "merlin"]

[project.scripts]
nilm-timeline = "nilmtimeline.main:run"
nilm-timeline-calibrate = "nilmtimeline.calibrate:calibrate"
nilm-timeline-configure = "nilmtimeline.configure:configure"
